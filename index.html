<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuri Santos | Experiência Cinematográfica</title>
    <link rel="icon" href="img/IMG-20260215-WA0102.jpg" type="image/png">    
    
    <!-- FONTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            background: #0A0A0A;
        }

        /* ===== FUNDO CINEMATOGRÁFICO ===== */
        .cinematic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .particles-loading {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .particle-load {
            position: absolute;
            background: rgba(76, 175, 80, 0.15);
            border-radius: 50%;
            filter: blur(2px);
            animation: floatLiquid 12s infinite ease-in-out;
        }

        .liquid-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(76, 175, 80, 0.15) 0%, transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(56, 142, 60, 0.15) 0%, transparent 35%),
                radial-gradient(circle at 40% 80%, rgba(255, 255, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 20%, rgba(76, 175, 80, 0.1) 0%, transparent 30%);
            filter: blur(20px);
            animation: liquidMove 20s infinite alternate;
            z-index: 2;
        }

        .vignette {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(0, 0, 0, 0.4) 100%);
            z-index: 3;
            pointer-events: none;
        }

        @keyframes floatLiquid {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            33% { transform: translate(2%, -2%) scale(1.1); opacity: 0.5; }
            66% { transform: translate(-1%, 3%) scale(0.9); opacity: 0.2; }
        }

        @keyframes liquidMove {
            0% { transform: scale(1) rotate(0deg); opacity: 0.5; }
            50% { transform: scale(1.2) rotate(2deg); opacity: 0.8; }
            100% { transform: scale(1) rotate(-2deg); opacity: 0.5; }
        }

        .loading-container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 480px;
            width: 90%;
            padding: 50px 40px;
            background: rgba(20, 20, 30, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 48px;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1) inset, 0 0 40px rgba(76, 175, 80, 0.3);
            animation: cardAppear 1s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .loading-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.3) 0%, transparent 60%);
            opacity: 0.4;
            animation: rotate 20s linear infinite;
            pointer-events: none;
        }

        .loading-container::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, rgba(76, 175, 80, 0.5), rgba(255, 255, 255, 0.3), rgba(56, 142, 60, 0.5), rgba(76, 175, 80, 0.5));
            border-radius: 50px;
            z-index: -1;
            animation: borderGlow 4s linear infinite;
            filter: blur(5px);
            opacity: 0.5;
        }

        @keyframes borderGlow {
            0%, 100% { opacity: 0.3; filter: blur(5px); }
            50% { opacity: 0.7; filter: blur(8px); }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: scale(0.9) translateY(30px); filter: blur(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FFFFFF, #E0E0E0, #4CAF50);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
            position: relative;
            z-index: 5;
            text-shadow: 0 0 30px rgba(76, 175, 80, 0.5);
        }

        .subtitle-load {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 40px;
            position: relative;
            z-index: 5;
            text-transform: uppercase;
        }

        .liquid-progress {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            margin: 30px 0 20px;
            overflow: hidden;
            position: relative;
            z-index: 5;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.2);
        }

        .liquid-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4CAF50, #2E7D32, #4CAF50, #2E7D32, #4CAF50);
            background-size: 300% 100%;
            border-radius: 4px;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: liquidShimmer 3s infinite linear;
            position: relative;
            box-shadow: 0 0 15px #4CAF50;
        }

        .liquid-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: liquidReflection 1.5s infinite;
        }

        @keyframes liquidShimmer {
            0% { background-position: 0% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes liquidReflection {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(100%); }
            100% { transform: translateX(200%); }
        }

        .loading-status {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
            font-weight: 300;
            margin: 15px 0;
            position: relative;
            z-index: 5;
            letter-spacing: 0.5px;
        }

        .loading-status span {
            color: #4CAF50;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }

        .bubble-counter {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 25px 0 15px;
            position: relative;
            z-index: 5;
        }

        .bubble {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            box-shadow: 0 0 10px transparent;
        }

        .bubble::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .bubble.loaded {
            background: #4CAF50;
            border-color: rgba(255, 255, 255, 0.5);
            transform: scale(1.3);
            box-shadow: 0 0 20px #4CAF50;
        }

        .bubble.loaded::before {
            opacity: 1;
        }

        .ready-message {
            color: #FFFFFF;
            margin-top: 25px;
            font-size: 1rem;
            opacity: 0;
            transition: opacity 0.5s;
            font-weight: 400;
            position: relative;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(76, 175, 80, 0.15);
            backdrop-filter: blur(5px);
            padding: 10px 20px;
            border-radius: 40px;
            border: 1px solid rgba(76, 175, 80, 0.3);
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .ready-message.show {
            opacity: 1;
        }

        .ready-message i {
            color: #4CAF50;
            animation: checkPulse 1s infinite;
        }

        @keyframes checkPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .redirect-info {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
            margin-top: 30px;
            position: relative;
            z-index: 5;
            letter-spacing: 1px;
        }

        .percentage-liquid {
            font-size: 1.2rem;
            font-weight: 600;
            color: #4CAF50;
            text-shadow: 0 0 15px rgba(76, 175, 80, 0.5);
            margin-bottom: 5px;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.8rem; }
            .loading-container { padding: 40px 25px; }
            .bubble { width: 10px; height: 10px; }
        }
    </style>
</head>
<body>
    <div class="cinematic-bg">
        <div class="particles-loading" id="particles-loading"></div>
        <div class="liquid-overlay"></div>
        <div class="vignette"></div>
    </div>

    <div class="loading-container">
        <h1>Desenjão</h1>
        <div class="subtitle-load">Programador</div>
        
        <div class="liquid-progress">
            <div class="liquid-fill" id="progressBar"></div>
        </div>

        <div class="percentage-liquid" id="percentageDisplay">0%</div>

        <div class="loading-status" id="loadingStatus">
            <span id="loadedCount">0</span>/<span id="totalCount">0</span> frames carregados
        </div>

        <div class="bubble-counter" id="bubbleCounter"></div>

        <div class="ready-message" id="readyMessage">
            <i class="fas fa-check-circle"></i>
            Experiência pronta
        </div>

        <div class="redirect-info" id="redirectInfo">
            preparando sua experiência cinematográfica
        </div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <script>
        // Lista de imagens
        const imagesToPreload = [
            'img/ttle.png',
            'img/servicos.png',
            'img/2.png',
            'img/3.png',
            'img/4.png',
            'img/fundo.png'
        ];

        // Elementos DOM
        const progressBar = document.getElementById('progressBar');
        const loadedSpan = document.getElementById('loadedCount');
        const totalSpan = document.getElementById('totalCount');
        const readyMessage = document.getElementById('readyMessage');
        const redirectInfo = document.getElementById('redirectInfo');
        const bubbleCounter = document.getElementById('bubbleCounter');
        const percentageDisplay = document.getElementById('percentageDisplay');
        
        let loadedImages = 0;
        let isRedirecting = false; // Evita múltiplos redirecionamentos
        const totalImages = imagesToPreload.length;
        totalSpan.textContent = totalImages;
        
        // Array para controlar quais imagens já foram carregadas
        const imageLoadedStatus = new Array(totalImages).fill(false);
        
        // Criar bolhas
        imagesToPreload.forEach((_, index) => {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.id = `bubble-${index}`;
            bubbleCounter.appendChild(bubble);
        });

        // Função para atualizar a interface (SINCRONIZADA)
        function updateProgress() {
            const percentage = (loadedImages / totalImages) * 100;
            const roundedPercentage = Math.round(percentage);
            
            // Atualiza barra de progresso
            progressBar.style.width = `${percentage}%`;
            
            // Atualiza porcentagem
            percentageDisplay.textContent = `${roundedPercentage}%`;
            
            // Atualiza texto de status
            redirectInfo.textContent = `processando... ${roundedPercentage}%`;
            
            console.log(`Progresso: ${loadedImages}/${totalImages} (${roundedPercentage}%)`); // Debug
            
            // Verifica se completou
            if (loadedImages === totalImages && !isRedirecting) {
                isRedirecting = true;
                redirectInfo.textContent = 'redirecionando em 1 segundo';
                readyMessage.classList.add('show');
                
                console.log('Todas imagens carregadas! Redirecionando...');
                
                setTimeout(() => {
                    window.location.href = 'biosite.html';
                }, 1000);
            }
        }
        
        function markImageLoaded(index) {
            // Evita marcar a mesma imagem duas vezes
            if (imageLoadedStatus[index]) return;
            
            imageLoadedStatus[index] = true;
            loadedImages++;
            loadedSpan.textContent = loadedImages;
            
            // Marca a bolha
            const bubble = document.getElementById(`bubble-${index}`);
            if (bubble) bubble.classList.add('loaded');
            
            // Atualiza progresso
            updateProgress();
        }

        function preloadImage(src, index) {
            return new Promise((resolve) => {
                // Verifica se a imagem já está no cache do navegador
                const cachedImg = new Image();
                cachedImg.src = src;
                
                // Se a imagem já está completa no cache
                if (cachedImg.complete) {
                    console.log(`Imagem ${index} já estava em cache: ${src}`);
                    markImageLoaded(index);
                    resolve();
                    return;
                }
                
                // Se não está em cache, carrega normalmente
                const img = new Image();
                
                img.onload = () => {
                    console.log(`Imagem ${index} carregada: ${src}`);
                    markImageLoaded(index);
                    resolve();
                };
                
                img.onerror = () => {
                    console.error(`Erro ao carregar: ${src}`);
                    // Mesmo com erro, conta como "carregado" para não travar
                    markImageLoaded(index);
                    resolve();
                };
                
                // Timeout para não travar para sempre
                const timeout = setTimeout(() => {
                    if (!imageLoadedStatus[index]) {
                        console.warn(`Timeout para imagem ${index}: ${src}`);
                        markImageLoaded(index);
                        resolve();
                    }
                }, 5000);
                
                img.src = src;
                
                // Limpa timeout se carregar
                img.onload = () => {
                    clearTimeout(timeout);
                    console.log(`Imagem ${index} carregada: ${src}`);
                    markImageLoaded(index);
                    resolve();
                };
                
                img.onerror = () => {
                    clearTimeout(timeout);
                    console.error(`Erro ao carregar: ${src}`);
                    markImageLoaded(index);
                    resolve();
                };
            });
        }

        function createParticles() {
            const container = document.getElementById('particles-loading');
            const particleCount = 20;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle-load';
                
                const size = Math.random() * 100 + 30;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                particle.style.animationDelay = `${Math.random() * 5}s`;
                particle.style.animationDuration = `${Math.random() * 10 + 10}s`;
                
                container.appendChild(particle);
            }
        }

        async function startLoading() {
            createParticles();
            
            console.log('Iniciando pré-carregamento...');
            
            // Carrega todas as imagens em paralelo
            const loadPromises = imagesToPreload.map((src, index) => preloadImage(src, index));
            
            // Aguarda todas completarem
            await Promise.all(loadPromises);
            
            console.log('Pré-carregamento finalizado!');
        }

        // Fallback de segurança
        setTimeout(() => {
            if (!isRedirecting && loadedImages < totalImages) {
                console.warn('Fallback ativado - forçando redirecionamento');
                isRedirecting = true;
                window.location.href = 'biosite.html';
            }
        }, 8000);
        
        // Inicia o carregamento
        startLoading();
    </script>
</body>
</html>
